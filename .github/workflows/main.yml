name: python-deployment

run-name: ${{ github.actor }} - ${{ github.ref_name }} - ${{ github.sha }}

on:
  push:
    branches: ["your_name"]
  pull_request:
    branches: ["main"]

env:
  PythonVersion: "3.8"

jobs:
  python-ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./src

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PythonVersion }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install coverage flake8
          pip install -r requirements.txt

      - name: Run tests
        run: |
          python manage.py test

      - name: Generate Report
        run: |
          coverage run --source='.' manage.py test
          coverage report

      - name: Linting (non-blocking)
        run: |
          flake8 . --show-source --statistics --exit-zero

      - name: Check Complexity (non-blocking)
        run: |
          flake8 . --exit-zero --max-complexity=6

      - name: Upload workflow artifacts (src + helm-charts)
        if: github.event_name == 'push' && github.ref_name == 'develop'
        uses: actions/upload-artifact@v4
        with:
          name: workflow-artifacts
          path: |
            src
            helm-charts
            
  docker-ci:
    needs: python-ci
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref_name == 'develop'

    steps:
      - name: Download workflow artifacts
        uses: actions/download-artifact@v4
        with:
          name: workflow-artifacts
  
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
  
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
  
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./src
          file: ./src/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.DockerImageName }}:${{ github.sha }}

  helm-ci:
    needs: python-ci
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref_name == 'develop'

    steps:
      - name: Download workflow artifacts
        uses: actions/download-artifact@v4
        with:
          name: workflow-artifacts

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.0

      - name: Helm template
        run: |
          helm template todoapp ./helm-charts/todoapp/

      - name: Helm lint
        run: |
          helm lint ./helm-charts/todoapp

      - name: Package chart
        run: |
          mkdir -p packaged
          helm package ./helm-charts/todoapp -d packaged

      - name: Upload chart package
        uses: actions/upload-artifact@v4
        with:
          name: helm-chart-package
          path: packaged/*.tgz
